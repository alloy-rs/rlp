[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.3.16"
edition = "2021"
rust-version = "1.71"
authors = ["Alloy Contributors"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/alloy-rs/rlp"
repository = "https://github.com/alloy-rs/rlp"
exclude = ["benches/", "tests/"]

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unnameable_types = "warn"

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing_const_for_fn = "warn"
use_self = "warn"
option_if_let_else = "warn"
redundant_clone = "warn"

[workspace.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace.dependencies]
# workspace crates
alloy-rlp = { version = "0.3.16", path = "crates/rlp", default-features = false }
alloy-rlp-derive = { version = "0.3.16", path = "crates/rlp-derive", default-features = false }

# macros
proc-macro2 = "1.0"
quote = "1.0"
syn = "2.0"

hex = { package = "const-hex", version = "1", default-features = false, features = [
    "alloc",
] }
hex-literal = "0.4"

# misc
arrayvec = { version = "0.7", default-features = false }
bytes = { version = "1.4", default-features = false }
serde = { version = "1.0", default-features = false, features = ["alloc"] }
serde_json = "1.0"
bincode = "1.3"
